appModuleMigrationTitle=Actualizar m\u00f3dulo de aplicaci\u00f3n
appModuleMigrationDescription=Actualiza la estructura del proyecto Bonita a un proyecto Maven multi-m\u00f3dulo.\n\nEste paso actualizar\u00e1 el m\u00f3dulo 'app', que contiene la mayor\u00eda de los artefactos del proyecto (diagramas, descriptores de aplicaci\u00f3n, etc.), y lo configurar\u00e1 para permitir la construcci\u00f3n de este proyecto utilizando Maven.\nPuedes encontrar m\u00e1s detalles sobre c\u00f3mo construir un proyecto Bonita en el <a href\="766">sitio de documentaci\u00f3n</a>.\n\nAl construir una aplicaci\u00f3n aut\u00f3noma a partir de un proyecto Bonita, ahora puedes optar por eliminar las dependencias predeterminadas de la Bonita Admin App y la Bonita User App. De manera predeterminada, solo se incluye la Bonita Admin App, y puedes a\u00f1adir o eliminar otras aplicaciones utilizando el Marketplace de extensiones.
createPomMigrationTitle=Crear archivo POM de proyecto
createPomMigrationDescription=Con la llegada de Bonita 2021.2, el proyecto Bonita ahora utiliza Maven para gestionar sus dependencias.\n\nLos conectores, filtros de actores u otras dependencias de librer\u00edas Java pueden ahora declararse directamente como dependencias de Maven.\nConsulta la documentaci\u00f3n para m\u00e1s informaci\u00f3n sobre la <a href\="727">composici\u00f3n de proyectos</a>.\n\nAdem\u00e1s, la versi\u00f3n de Java requerida ahora es Java 11.\n\nNOTA\: Si ya exist\u00eda un archivo pom.xml, este se ha guardado como copia de seguridad en un archivo pom.xml.old.\nEl archivo pom.xml est\u00e1 reservado para uso interno y no debe editarse directamente. Utiliza el nuevo panel de Project overview en el Studio para modificar tu proyecto.
removeLegacyFolderMigrationTitle=Eliminar carpetas heredadas del proyecto
removeLegacyFolderMigrationDescription=Eliminar carpetas del proyecto que ya no son relevantes (por ejemplo\: caracter\u00edstica no soportada).
splitGroovyAllMigrationTitle=Actualizaci\u00f3n de dependencia Groovy
splitGroovyAllMigrationDescription=Actualizar la dependencia Groovy en el proyecto para usar los artefactos de los m\u00f3dulos Groovy en lugar de la dependencia groovy-all obsoleta.
javaDependenciesMigrationTitle=Actualizaci\u00f3n de dependencias de Java
javaDependenciesMigrationDescription=Este paso actualizar\u00e1 las dependencias de tu proyecto, reemplazando los archivos jar en la carpeta 'lib' por dependencias de artefactos Maven.\n\nPara ello, se buscar\u00e1 en Maven Central una coincidencia entre cada archivo jar y un artefacto disponible (utilizando el hash del archivo).\nCuando no se encuentre una coincidencia, el archivo jar se mover\u00e1 a una carpeta .store siguiendo la estructura de un repositorio Maven y se instalar\u00e1 en tu repositorio Maven local.\n\nSe recomienda encarecidamente no depender de este mecanismo de almacenamiento local y asegurarse de que todas las dependencias externas est\u00e9n publicadas en un repositorio Maven (p\u00fablico o privado).
bdmModelArtifactMigrationTitle=Actualizaci\u00f3n de la dependencia del Modelo de Datos de Negocio
bdmModelArtifactMigrationDescription=Actualiza las coordenadas de artefactos para los artefactos generados de Modelo de Datos de Negocio.
multiModuleMigrationTitle=Actualizaci\u00f3n del proyecto multi-m\u00f3dulo
multiModuleMigrationDescription=La estructura del proyecto ha cambiado en favor de un proyecto Maven multi-m\u00f3dulo.\n\nEsto significa que la ubicaci\u00f3n de los archivos dentro del proyecto ha cambiado. Se trata de un cambio t\u00e9cnico que no afecta al uso de dise\u00f1o en Bonita Studio.\nLos nuevos m\u00f3dulos Maven y sus respectivos archivos 'pom.xml' est\u00e1n reservados para uso interno de Studio.\n\nEl Business Data Model (BDM) ahora se construye en su propio subm\u00f3dulo Maven.\nAunque esto no impacta en el uso de dise\u00f1o, ahora puede compilarse y desplegarse de manera independiente desde Studio.\n\nLa dependencia del modelo BDM comparte el mismo 'version' y 'groupId' del proyecto padre. Esto est\u00e1 definido por el formato del proyecto Bonita y no debe modificarse.
gitIgnoreMigrationTitle=Actualizaci\u00f3n de Git ignorar
gitIgnoreMigrationDescription=Actualizar el contenido del archivo '.gitignore' para manejar el nuevo dise\u00f1o del proyecto.
deleteProjectSettingsMigrationTitle=Eliminar ajustes del proyecto
deleteProjectSettingsMigrationDescription=Eliminar los metadatos del proyecto existentes para una importaci\u00f3n limpia de los metadatos del proyecto Maven.
updateProjectDescriptionMigrationTitle=Actualizar archivo del descriptor del proyecto
updateProjectDescriptionMigrationDescription=Actualice el archivo del descriptor del proyecto con las caracter\u00edsticas y constructores adecuados.
cleanParentMigrationTitle=Actualizar m\u00f3dulo padre del proyecto
cleanParentMigrationDescription=Tras la actualizaci\u00f3n de la estructura del proyecto a Maven multi-m\u00f3dulo, el m\u00f3dulo padre ahora hereda del parent pom 'org.bonitasoft\:bonita-project'.\n\nEste parent pom configura todos los plugins requeridos y las versiones de dependencias correspondientes a una versi\u00f3n espec\u00edfica de Bonita.
connectorsModuleMigrationTitle=Actualizar m\u00f3dulos de conectores y filtros de actores
connectorsModuleMigrationDescription=Las definiciones, implementaciones y fuentes de los Conectores y Filtros de Actor se han movido a nuevos proyectos de extensi\u00f3n dentro de la estructura del proyecto, con el fin de aprovechar el modelo multi-m\u00f3dulo de Maven.\nEsto significa que la ubicaci\u00f3n de los archivos dentro del proyecto ha cambiado. Se trata de un cambio t\u00e9cnico que no impacta en el uso de dise\u00f1o en Bonita Studio.\nLas extensiones del proyecto ahora se construyen en su propio m\u00f3dulo Maven.\nAunque no afecta al uso de dise\u00f1o, este cambio interno permite aprovechar el ciclo de vida est\u00e1ndar de compilaci\u00f3n de Maven.\n\nTodas las extensiones comparten la misma 'version' y 'groupId' del proyecto padre. Esto est\u00e1 definido por el formato del proyecto Bonita y no debe modificarse.
connectorsModuleMigrationTaskLoad=Cargando modelo principal Maven
connectorsModuleMigrationTaskConnectors=Moviendo conectores a su propio m\u00f3dulo
connectorsModuleMigrationTaskActorFilters=Moviendo filtros de actor a su propio m\u00f3dulo
connectorsModuleMigrationTaskDependencies=A\u00f1adiendo dependencias al m\u00f3dulo de aplicaci\u00f3n
extensionsModuleMigrationTitle=Actualizar m\u00f3dulos de extensiones
extensionsModuleMigrationDescription=Los proyectos de Rest API Extensions y Themes se han movido dentro de la estructura del proyecto para aprovechar el modelo multi-m\u00f3dulo de Maven.\nEsto significa que la ubicaci\u00f3n de los archivos dentro del proyecto ha cambiado. Se trata de un cambio t\u00e9cnico que no impacta en el uso de dise\u00f1o en Bonita Studio. Las extensiones del proyecto ahora se construyen en su propio m\u00f3dulo Maven.\nAunque no afecta al uso de dise\u00f1o, este cambio interno permite aprovechar el ciclo de vida est\u00e1ndar de compilaci\u00f3n de Maven.\n\nTodas las extensiones comparten la misma 'version' y 'groupId' del proyecto padre. Esto est\u00e1 definido por el formato del proyecto Bonita y no debe modificarse.
providedGroovyScriptRemovedMigrationTitle=Eliminar las clases Groovy proporcionadas
providedGroovyScriptRemovedMigrationDescription=Las clases Groovy proporcionadas y obsoletas 'BonitaUsers', 'BonitaSql', 'BonitaXML' y 'BonitaTypes' ser\u00e1n eliminadas.\n\nSi a\u00fan no lo has hecho, actualiza cualquier script Groovy que haga referencia a estas clases utilizando las alternativas disponibles.\n\nPuedes usar las plantillas de c\u00f3digo del editor de expresiones (Expression editor) para ayudarte a actualizar tus scripts.
bonitaProjectParentVersionMigrationTitle=Actualizar versi\u00f3n padre del proyecto Bonita
bonitaProjectParentVersionMigrationDescription=El padre del proyecto Bonita ha sido actualizado a %s.
