bdmAssemblyConfigurationMigrationDescription=La configuraci\u00f3n de construcci\u00f3n del m\u00f3dulo Modelo de Datos de Negocio ha sido actualizada para soportar la construcci\u00f3n de Maven.
removeFlattenPluginMigrationTitle=Actualizar configuraci\u00f3n del m\u00f3dulo Modelo de Datos de Negocio
removeFlattenPluginMigrationDescription=Las ejecuciones 'flatten-maven-plugin' se han eliminado del m\u00f3dulo padre de BDM. Ahora son heredadas del padre del proyecto Bonita.
