dependenciesInstallationMsg=L'installation des d\u00e9pendances \u00e0 partir du d\u00e9p\u00f4t Maven central a \u00e9chou\u00e9. Vous ne pourrez pas utiliser Bonita Studio.\nUn acc\u00e8s internet au d\u00e9p\u00f4t central de Maven est obligatoire pour activer cette fonctionnalit\u00e9.\nSi votre fournisseur restreint l'acc\u00e8s \u00e0 Internet, vous pouvez configurer les param\u00e8tres du proxy ou cr\u00e9er un d\u00e9p\u00f4t miroir. Consultez le site de documentation pour plus d'informations.
