appModuleMigrationTitle=Mettre \u00e0 jour le module d'application
appModuleMigrationDescription=Mettre \u00e0 jour la structure du projet Bonita en un projet Maven multi-modules. \n\nCette \u00e9tape mettra \u00e0 jour le module 'app' contenant la plupart des artefacts du projet (diagrammes, descripteurs d'application, etc.) et le configurera pour permettre la compilation de ce projet en utilisant Maven. Plus de d\u00e9tails sur la compilation d'un projet Bonita peuvent \u00eatre trouv\u00e9s sur le <a href\="766">site de documentation</a>. \n\nLors de la compilation d'une application autonome \u00e0 partir d'un projet Bonita, vous pouvez d\u00e9sormais choisir de retirer les d\u00e9pendances par d\u00e9faut de l'application Admin Bonita et de l'application Utilisateur Bonita. \nPar d\u00e9faut, seule l'application Admin Bonita est incluse et vous pouvez ajouter/supprimer d'autres applications en utilisant la Marketplace des extensions.
createPomMigrationTitle=Cr\u00e9er un fichier POM du projet
createPomMigrationDescription=Avec l'introduction de Bonita 2021.2, le projet Bonita utilise d\u00e9sormais Maven pour g\u00e9rer ses d\u00e9pendances. \n\nLes connecteurs, filtres d'acteurs ou toute autre d\u00e9pendance de biblioth\u00e8que Java peuvent maintenant \u00eatre d\u00e9clar\u00e9s comme d\u00e9pendances Maven. \nConsultez la documentation pour plus d'informations sur la <a href\="727">Composition du projet</a>. \n\nDe plus, la version Java requise est maintenant Java 11. \n\nREMARQUE \: Si un fichier pom.xml existait d\u00e9j\u00e0, il a \u00e9t\u00e9 sauvegard\u00e9 dans un fichier pom.xml.old. Le fichier pom.xml est r\u00e9serv\u00e9 \u00e0 un usage interne et ne doit pas \u00eatre acc\u00e9d\u00e9 directement. Utilisez le nouveau tableau de bord de vue d'ensemble du projet dans le Studio pour \u00e9diter votre projet.
removeLegacyFolderMigrationTitle=Supprimer les dossiers existants du projet
removeLegacyFolderMigrationDescription=Retirer des dossiers du projet qui ne sont plus pertinents (par exemple\: la fonctionnalit\u00e9 n'est plus support\u00e9e).
splitGroovyAllMigrationTitle=Mise \u00e0 jour des d\u00e9pendances Groovy
splitGroovyAllMigrationDescription=Mettre \u00e0 jour la d\u00e9pendance de Groovy dans le projet pour utiliser les artefacts des modules Groovy au lieu de la d\u00e9pendance obsol\u00e8te de groovy-all.
javaDependenciesMigrationTitle=Mise \u00e0 jour des d\u00e9pendances Java
javaDependenciesMigrationDescription=Cette \u00e9tape mettra \u00e0 jour les d\u00e9pendances de votre projet depuis les fichiers jar du dossier 'lib' vers des d\u00e9pendances d'artefacts Maven. \n\nPour ce faire, elle recherchera sur Maven Central une correspondance entre un fichier jar et un artefact disponible (en utilisant le hash du fichier jar). Lorsqu'aucune correspondance n'est trouv\u00e9e, le fichier jar sera d\u00e9plac\u00e9 dans un dossier '.store' en utilisant une structure de d\u00e9p\u00f4t Maven et install\u00e9 dans votre d\u00e9p\u00f4t Maven local. \nIl est fortement recommand\u00e9 de ne pas s'appuyer sur ce m\u00e9canisme de stockage local et de s'assurer que toutes vos d\u00e9pendances externes sont publi\u00e9es sur un d\u00e9p\u00f4t Maven (public ou priv\u00e9).
bdmModelArtifactMigrationTitle=Mise \u00e0 jour des d\u00e9pendances du Mod\u00e8le de Donn\u00e9es M\u00e9tier
bdmModelArtifactMigrationDescription=Mettre \u00e0 jour les coordonn\u00e9es de l'artefact pour les artefacts g\u00e9n\u00e9r\u00e9s du Mod\u00e8le de Donn\u00e9es M\u00e9tier.
multiModuleMigrationTitle=Mise \u00e0 jour du projet multi-module
multiModuleMigrationDescription=La structure du projet a \u00e9t\u00e9 modifi\u00e9e en faveur d'un projet Maven multi-modules. \n\nCela signifie que l'emplacement des fichiers \u00e0 l'int\u00e9rieur du projet a chang\u00e9. Il s'agit d'un changement technique qui n'impactera pas l'utilisation en conception dans Bonita Studio. \nLes nouveaux modules Maven et leurs fichiers 'pom.xml' respectifs sont r\u00e9serv\u00e9s \u00e0 un usage interne du Studio. \n\nLe Mod\u00e8le de Donn\u00e9es M\u00e9tier (BDM) est maintenant construit dans son propre sous-module Maven. Bien que cela n'impacte pas l'utilisation en conception, il peut d\u00e9sormais \u00eatre construit et d\u00e9ploy\u00e9 ind\u00e9pendamment d'un Studio. \n\nLa d\u00e9pendance du mod\u00e8le BDM partage la m\u00eame 'version' et le m\u00eame 'groupId' que le projet parent. Ceci est impos\u00e9 par le format du projet Bonita et ne doit pas \u00eatre modifi\u00e9.
gitIgnoreMigrationTitle=Git ignore la mise \u00e0 jour
gitIgnoreMigrationDescription=Mettre \u00e0 jour le contenu du fichier '.gitignore' pour g\u00e9rer la mise en page du nouveau projet.
deleteProjectSettingsMigrationTitle=Supprimer les param\u00e8tres du projet
deleteProjectSettingsMigrationDescription=Supprimer les m\u00e9tadonn\u00e9es existantes du projet pour une importation pure des m\u00e9tadonn\u00e9es du projet Maven.
updateProjectDescriptionMigrationTitle=Mettre \u00e0 jour le fichier du descripteur de projet
updateProjectDescriptionMigrationDescription=Mettre \u00e0 jour le fichier descripteur de projet avec les natures et les constructeurs appropri\u00e9s.
cleanParentMigrationTitle=Mettre \u00e0 jour le module parent du projet
cleanParentMigrationDescription=Suite \u00e0 la mise \u00e0 jour de la structure du projet vers Maven multi-modules, le module parent h\u00e9rite maintenant du pom parent org.bonitasoft\:bonita-project. \nCe pom parent configure tous les plugins requis et les versions de d\u00e9pendances pour une version Bonita donn\u00e9e.
connectorsModuleMigrationTitle=Mise \u00e0 jour des connecteurs et filtres d'acteurs
connectorsModuleMigrationDescription=Definitions, implementations and sources for Connectors and Actor filters have been moved to new extension projects in the project layout to benefit from the Maven multi-module layout.\nIt means that files location inside the project have changed. It is a technical change and will not impact the design usage in Bonita Studio. Project's extensions are now build in their own maven module.\nWhile it does not impact the design usage, this internal change allow the usage of a standard Maven build lifecycle.\n\nAll extensions share the same 'version' and 'groupId' of the parent project. It is enforced by the format of the Bonita project and must not be changed.
connectorsModuleMigrationTaskLoad=Loading main Maven model
connectorsModuleMigrationTaskConnectors=Moving connectors to their own module
connectorsModuleMigrationTaskActorFilters=Moving actor filters to their own module
connectorsModuleMigrationTaskDependencies=Adding dependencies to the application module
extensionsModuleMigrationTitle=Extensions modules update
extensionsModuleMigrationDescription=Rest API Extensions and Themes projects have been moved in the project layout to benefit from the Maven multi-module layout.\nIt means that files location inside the project have changed. It is a technical change and will not impact the design usage in Bonita Studio. Project's extensions are now build in their own maven module.\nWhile it does not impact the design usage, this internal change allow the usage of a standard Maven build lifecycle.\n\nAll extensions share the same 'version' and 'groupId' of the parent project. It is enforced by the format of the Bonita project and must not be changed.
providedGroovyScriptRemovedMigrationTitle=Remove provided Groovy classes
providedGroovyScriptRemovedMigrationDescription=Deprecated provided Groovy classes `BonitaUsers`, `BonitaSql`, `BonitaXML` and `BonitaTypes` will be removed.\n\nIf not already done, update any Groovy script referencing these classes with alternatives.\n\nYou may use Expression editor's code templates to help you update your scripts.
