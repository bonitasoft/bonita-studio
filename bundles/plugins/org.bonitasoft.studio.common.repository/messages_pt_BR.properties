appModuleMigrationTitle=Atualizar m\u00f3dulo de aplica\u00e7\u00e3o
appModuleMigrationDescription=Atualize o layout do projeto Bonita para um projeto Maven multim\u00f3dulo.\n\nEsta etapa atualizar\u00e1 o m\u00f3dulo "app" que cont\u00e9m a maioria dos artefatos do projeto (diagramas, descritores de aplica\u00e7\u00e3o, etc.) e o configurar\u00e1 para permitir a constru\u00e7\u00e3o deste projeto usando Maven.\nMais detalhes sobre a constru\u00e7\u00e3o de um projeto Bonita podem ser encontrados no <a href\="766">site de documenta\u00e7\u00e3o</a>.\n\nAo construir uma aplica\u00e7\u00e3o independente a partir de um projeto Bonita, agora voc\u00ea pode optar por remover as depend\u00eancias padr\u00e3o do Aplicativo de Administra\u00e7\u00e3o Bonita e do Aplicativo de Usu\u00e1rio Bonita. Por padr\u00e3o, apenas o Aplicativo de Administra\u00e7\u00e3o Bonita \u00e9 inclu\u00eddo e voc\u00ea pode adicionar/remover outras aplica\u00e7\u00f5es usando o Marketplace de extens\u00f5es.
createPomMigrationTitle=Criar arquivo POM do projeto
createPomMigrationDescription=Apresentando o Bonita 2021.2, o projeto Bonita agora usa Maven para lidar com suas depend\u00eancias.\n\nConectores, filtros de atores ou quaisquer outras depend\u00eancias de bibliotecas Java agora podem ser declaradas como depend\u00eancias Maven.\nConsulte a documenta\u00e7\u00e3o para obter mais informa\u00e7\u00f5es sobre a <a href\="727">Composi\u00e7\u00e3o do projeto</a>.\n\nAl\u00e9m disso, a vers\u00e3o Java necess\u00e1ria agora \u00e9 Java 11.\n\nNOTA\: Se um `pom.xml` j\u00e1 existia, ele foi salvo em um arquivo `pom.xml.old`.\nO arquivo `pom.xml` \u00e9 reservado para uso interno e n\u00e3o deve ser acessado diretamente. Use o novo painel de vis\u00e3o geral do projeto no Studio para editar seu projeto.
removeLegacyFolderMigrationTitle=Remover pastas legadas do projeto
removeLegacyFolderMigrationDescription=Remover pastas do projeto que n\u00e3o s\u00e3o mais relevantes (por exemplo\: recurso n\u00e3o \u00e9 mais suportado).
splitGroovyAllMigrationTitle=Atualiza\u00e7\u00e3o da depend\u00eancia Groovy
splitGroovyAllMigrationDescription=Atualize a depend\u00eancia Groovy no projeto para usar artefatos Groovy em vez da depend\u00eancia obsoleta de groovy-all.
javaDependenciesMigrationTitle=Atualiza\u00e7\u00e3o das Depend\u00eancias Java
javaDependenciesMigrationDescription=Esta etapa atualizar\u00e1 as depend\u00eancias do seu projeto, dos arquivos jar na pasta "lib" para as depend\u00eancias de artefatos do Maven.\n\nPara isso, o Maven Central buscar\u00e1 uma correspond\u00eancia entre um arquivo jar e um artefato dispon\u00edvel (usando o hash do arquivo jar). Caso n\u00e3o seja encontrado, o arquivo jar ser\u00e1 movido para uma pasta ".store" usando um layout de reposit\u00f3rio Maven e instalado no seu reposit\u00f3rio Maven local.\n\u00c9 altamente recomend\u00e1vel n\u00e3o depender desse mecanismo de armazenamento local e garantir que todas as suas depend\u00eancias externas sejam publicadas em um reposit\u00f3rio Maven (p\u00fablico ou privado).
bdmModelArtifactMigrationTitle=Atualiza\u00e7\u00e3o do Modelo de Dados de Neg\u00f3cio
bdmModelArtifactMigrationDescription=Atualize as coordenadas do artefato para os artefatos do Modelo de Dados de Neg\u00f3cio gerados.
multiModuleMigrationTitle=Atualiza\u00e7\u00e3o do projeto Multi-m\u00f3dulo
multiModuleMigrationDescription=O layout do projeto foi alterado para um projeto Maven multim\u00f3dulos.\n\nIsso significa que a localiza\u00e7\u00e3o dos arquivos dentro do projeto foi alterada. Trata-se de uma altera\u00e7\u00e3o t\u00e9cnica e n\u00e3o afetar\u00e1 o uso do design no Bonita Studio. Os novos m\u00f3dulos Maven e seus respectivos arquivos 'pom.xml' s\u00e3o reservados para uso interno do Studio.\n\nO Modelo de Dados de Neg\u00f3cios agora \u00e9 constru\u00eddo em seu pr\u00f3prio subm\u00f3dulo Maven.\nEmbora n\u00e3o afete o uso do design, agora pode ser constru\u00eddo e implantado independentemente de um Studio.\n\nA depend\u00eancia do modelo BDM compartilha a mesma 'vers\u00e3o' e 'groupId' do projeto pai. Isso \u00e9 imposto pelo formato do projeto Bonita e n\u00e3o deve ser alterado.
gitIgnoreMigrationTitle=Ignorar atualiza\u00e7\u00e3o do Git
gitIgnoreMigrationDescription=Atualize o conte\u00fado do arquivo '.gitignore' para lidar com o novo layout do projeto.
deleteProjectSettingsMigrationTitle=Excluir configura\u00e7\u00f5es do projeto
deleteProjectSettingsMigrationDescription=Remover metadados de projeto existentes para uma importa\u00e7\u00e3o limpa dos metadados do projeto Maven.
updateProjectDescriptionMigrationTitle=Atualizar arquivo de descritor do projeto
updateProjectDescriptionMigrationDescription=Atualiza o arquivo de descritor de projeto com caracter\u00edsticas e construtores adequados.
cleanParentMigrationTitle=Atualizar m\u00f3dulo pai do projeto
cleanParentMigrationDescription=Ap\u00f3s a atualiza\u00e7\u00e3o do layout do projeto para o Maven multim\u00f3dulo, o m\u00f3dulo pai agora herda do pomo pai `org.bonitasoft\:bonita-project`.\nEste pom pai configura todos os plugins necess\u00e1rios e vers\u00f5es de depend\u00eancias para uma determinada vers\u00e3o do Bonita. 
connectorsModuleMigrationTitle=M\u00f3dulos de conectores e filtros do Actor atualizados
connectorsModuleMigrationDescription=Defini\u00e7\u00f5es, implementa\u00e7\u00f5es e fontes para Conectores e Filtros de Ator foram movidas para novos projetos de extens\u00e3o no layout do projeto para se beneficiarem do layout multim\u00f3dulo do Maven.\nIsso significa que a localiza\u00e7\u00e3o dos arquivos dentro do projeto foi alterada. Trata-se de uma altera\u00e7\u00e3o t\u00e9cnica e n\u00e3o afetar\u00e1 o uso do design no Bonita Studio. As extens\u00f5es do projeto agora s\u00e3o compiladas em seu pr\u00f3prio m\u00f3dulo Maven.\nEmbora n\u00e3o afete o uso do design, essa altera\u00e7\u00e3o interna permite o uso de um ciclo de vida de compila\u00e7\u00e3o padr\u00e3o do Maven.\n\nTodas as extens\u00f5es compartilham a mesma 'vers\u00e3o' e 'groupId' do projeto pai. Isso \u00e9 imposto pelo formato do projeto Bonita e n\u00e3o deve ser alterado.
