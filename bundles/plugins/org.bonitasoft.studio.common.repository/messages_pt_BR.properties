dependenciesInstallationMsg=A instala\u00e7\u00e3o das depend\u00eancias do reposit\u00f3rio central do Maven falhou. N\u00e3o ser\u00e1 poss\u00edvel usar o Bonita Studio.\nUm acesso \u00e0 internet ao reposit\u00f3rio central do Maven \u00e9 obrigat\u00f3rio para habilitar esse recurso.\nSe seu provedor est\u00e1 restringindo o acesso \u00e0 Internet, voc\u00ea pode configurar configura\u00e7\u00f5es de proxy ou criar um reposit\u00f3rio espelho. Verifique o site de documenta\u00e7\u00e3o para mais informa\u00e7\u00f5es.
